; RealForgeWater settings. This file is read again each time a save is loaded:
; edit it with the game running, then load your save to see the result.
; With SKSE Menu Framework installed, every [WaterLook] value can also be tuned live in the
; in-game menu (Real Forge Water > Water look), then saved back here with "Save to ini".

[General]
; 0 = only detect forge water and write it to the log, 1 = turn it into real water
iMode = 1
; 1 = hide other real water found in a converted trough. Realistic Water Two adds its own (very clear)
; water at every vanilla forge, right on top of ours, which would hide it.
bHideOtherTroughWater = 1
; 1 = log every shape of every forge mesh and more details (useful to report a forge mod whose
; water is not detected)
bVerboseLog = 0

[Water]
; Water type (WATR record) the forge water starts from. Default: vanilla horse trough water.
; The plugin works on its own copy, so real horse troughs are not affected.
sWaterTypeFormID = 0x000F762D
sWaterTypePlugin = Skyrim.esm
; Wave texture of the forge water only (no other water is affected).
; Default: the game's original wave texture, shipped with this plugin under its own path so water mods
; do not replace it. Empty = the global wave texture shared by all water, as replaced by your water mod
; (Realistic Water Two...). Any other texture path works too.
sWaveTexture = Data\Textures\RealForgeWater\Water\DefaultWater.dds

[WaterLook]
; Overrides applied on top of the water type above. Delete a line (or leave it empty) to keep
; the water type's own value. Vanilla horse trough values are given in brackets.

; How much the surface reflects [0.42], and how much more it reflects at grazing angles [0.14]
fReflectionAmount = 0.8
fFresnelAmount = 0.3
; Strength of the reflection [0.34]
fReflectionMagnitude = 1.0
; Reflections kept in shallow water, 0-1 [0.79]
fDepthReflections = 1.0

; Transparency: water color builds up between these depths, in game units [220 / 4710].
; The trough is about 25 units deep: lower values = darker, less see-through water.
fFogDistanceNear = 0
fFogDistanceFar = 60
; How opaque that fog gets, 0-1 [0.75]
fFogAmount = 0.85

; Distortion of what is seen through the water [24], and in shallow water [0.74]
fRefractionMagnitude =
fDepthRefraction =

; Colors as R, G, B (0-255): shallow [55, 64, 57], deep [5, 16, 5], reflection tint [103, 122, 117]
sShallowColor = 40, 46, 42
sDeepColor = 8, 12, 10
sReflectionColor =

; Highlights from lights such as the forge fire: brightness [100], sharpness [10000], in shallow water [0.52]
fSpecularBrightness =
fSpecularPower =
fDepthSpecular =
; Sun highlight [3] and its sharpness [3028], sun sparkles [2] and their sharpness [7113]
fSunSpecularMagnitude =
fSunSpecularPower =
fSunSparkleMagnitude =
fSunSparklePower =

; Wind and waves: the surface is animated by 3 noise layers moving with the wind.
; Speed [0.011 / 0.043 / 0.024], direction in degrees [0 / 60 / 277],
; amplitude [0.47 / 0.25 / 0.24], scale (lower = smaller waves) [754 / 290 / 153]
fWindSpeed1 =
fWindDirection1 =
fWaveAmplitude1 =
fWaveScale1 =
fWindSpeed2 =
fWindDirection2 =
fWaveAmplitude2 =
fWaveScale2 =
fWindSpeed3 =
fWindDirection3 =
fWaveAmplitude3 =
fWaveScale3 =
; Waves kept in shallow water [0.30]
fDepthNormals =

; Ripples from rain, hits and anything entering the water. The vanilla trough water has none
; (all 0); these are the values of the game's default water.
; Size [0], force [0], speed [0], falloff [0], damping (close to 1 = ripples last longer) [0]
fRippleSize = 0.7
fRippleForce = 0.1
fRippleVelocity = 0.85
fRippleFalloff = 0.8
fRippleDampener = 0.98
